[package]
name = "smp"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Smallest Maximum Power standalone Firecracker controller"
license = "Proprietary"
build = "build.rs"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.41", features = ["derive"] }
fs2 = "0.4.3"
hex = "0.4.3"
libc = "0.2.174"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"
uuid = { version = "1.16.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.20.0"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
