[package]
name = "smp"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
build = "build.rs"
description = "Smallest Maximum Power standalone Firecracker microVM controller"
license = "Apache-2.0"
repository = "https://github.com/StealthEyeLLC/smp"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
libc = "0.2"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
uuid = { version = "1.17", features = ["v4", "serde"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
